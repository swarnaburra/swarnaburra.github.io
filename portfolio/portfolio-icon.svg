<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5ebe0"/>
  
  <!-- Folder/Portfolio shape -->
  <path d="M 50 70 L 80 70 L 90 60 L 150 60 L 150 140 L 50 140 Z" fill="#c1694f"/>
  
  <!-- Folder tab -->
  <path d="M 80 70 L 90 60 L 90 70 Z" fill="#8b7355"/>
  
  <!-- Document lines to represent portfolio content -->
  <rect x="65" y="85" width="70" height="4" rx="2" fill="#f5ebe0" opacity="0.9"/>
  <rect x="65" y="95" width="60" height="4" rx="2" fill="#f5ebe0" opacity="0.8"/>
  <rect x="65" y="105" width="65" height="4" rx="2" fill="#f5ebe0" opacity="0.9"/>
  
  <!-- Code brackets to represent web portfolio -->
  <text x="70" y="130" font-family="monospace" font-size="20" font-weight="bold" fill="#f5ebe0">&lt;/&gt;</text>
  
  <!-- Decorative code dots -->
  <circle cx="110" cy="123" r="2.5" fill="#d4a574"/>
  <circle cx="120" cy="123" r="2.5" fill="#d4a574"/>
  <circle cx="130" cy="123" r="2.5" fill="#d4a574"/>
</svg>
